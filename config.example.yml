# Example configuration for ebird-rss.
#
# Pass this file with -config. Every field is optional; anything you omit falls
# back to the default shown in the comment. Copy it, edit it, and point -config
# at your copy.

# How many sightings to include, most recent first.
# Default: 20
count: 40

# Output feed format: rss, atom, or json.
# Default: rss
format: rss

# The IANA time zone to fall back on when a sighting's zone can't be determined
# from its coordinates — a row with no coordinates, or coordinates that land
# nowhere on Earth. Sightings that do carry usable coordinates are dated in the
# zone of the place they were recorded, so a trip out of state comes out right
# without any configuration.
# Default: the machine's local time zone
fallback_timezone: "America/Detroit"

# Channel-level metadata describing the feed itself.
feed:
  # The feed's title, shown by readers as its name.
  # Default: eBird Sightings
  title: "Chris Dzombak • Bird Sightings"

  # A short description / subtitle.
  # Default: Recent bird sightings from eBird.
  description: "Birds I've recently seen and logged to eBird."

  # The website the feed represents (the channel <link> / home page).
  # Default: https://ebird.org/
  link: "https://ebird.org/profile/MjA4NjIyNA"

  # The canonical URL where this feed is published (the feed's self link).
  # Rendered as rel="self" in Atom output and as feed_url in JSON Feed output.
  # RSS output does not include a self link.
  # Default: omitted
  feed_url: "https://www.dzombak.com/feeds/birds.rss.xml"

  # Feed author.
  # Default: omitted
  author: "Chris Dzombak"

  # Feed language as a BCP 47 code (e.g. en-US, fr, de).
  # Default: omitted
  language: "en-US"
